[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartdialer-prototype"
version = "0.1.0"
description = "Safety-first progressive and predictive SmartDialer prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
smartdialer = "smartdialer.cli:main"

[tool.setuptools]
packages = ["smartdialer"]

